<title>Villa films</title>
<style>
  :root {
    --bg: #F5F4F1;
    --fg: #0E0F0D;
    --mute: #6E736C;
    --line: #DEDDD8;
    --go: #1FA463;
    --go-dark: #17834F;
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D0E0C; --fg: #F2F1EC; --mute: #8C918A; --line: #23251F; --go: #25B36D; --go-dark: #2ec77c; }
  }

  :root[data-theme="dark"] {
    --bg: #0D0E0C; --fg: #F2F1EC; --mute: #8C918A; --line: #23251F; --go: #25B36D; --go-dark: #2ec77c;
  }

  :root[data-theme="light"] {
    --bg: #F5F4F1; --fg: #0E0F0D; --mute: #6E736C; --line: #DEDDD8; --go: #1FA463; --go-dark: #17834F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  img { display: block; width: 100%; }

  main { max-width: 30rem; margin: 0 auto; padding: 0 1.25rem 4rem; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 1.5rem 0 1.75rem;
    font-size: .75rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--mute);
  }

  figure { margin: 0; aspect-ratio: 4 / 5; overflow: hidden; background: var(--line); }
  figure img { height: 100%; object-fit: cover; }

  h1 {
    font-size: clamp(2.1rem, 8.5vw, 2.9rem);
    font-weight: 550;
    line-height: 1.03;
    letter-spacing: -.038em;
    margin: 2.25rem 0 0;
    text-wrap: balance;
  }

  .sub { font-size: 1.0625rem; color: var(--mute); margin: .875rem 0 0; text-wrap: pretty; }

  .rates {
    display: flex;
    flex-wrap: wrap;
    gap: .375rem 1.25rem;
    margin: 2rem 0 0;
    padding: 1rem 0 0;
    border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: .9375rem;
  }

  .rates div { white-space: nowrap; }
  .rates b { font-weight: 600; }
  .rates span { color: var(--mute); }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin: 2rem 0 0;
    padding: 1.0625rem;
    background: var(--go);
    color: #fff;
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -.01em;
    text-decoration: none;
    border-radius: 3px;
    transition: background .15s ease;
  }

  .cta:hover { background: var(--go-dark); }
  .cta svg { width: 1.125rem; height: 1.125rem; }
  .cta:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .free { margin: 1rem 0 0; font-size: .9375rem; color: var(--mute); text-align: center; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
